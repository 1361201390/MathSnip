name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Test (no Mathpix requests)
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name MathSnip --icon assets/mathsnip.ico mathsnip.py
      - uses: actions/upload-artifact@v4
        with:
          name: MathSnip-Windows
          path: dist/MathSnip.exe
          if-no-files-found: error
